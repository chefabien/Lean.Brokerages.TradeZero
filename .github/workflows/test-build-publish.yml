# CI/CD for the TradeZero brokerage, in three jobs:
#
#   test    -> compile the solution against Lean's sources and run every test that needs no
#              TradeZero credentials (unit, tz-mock scenarios, Lean's brokerage suite, Python).
#              Paper-API tests (category "Paper") are never run here: they are run locally only.
#   build   -> build the Docker image on top of the Lean image and smoke-test it end to end
#              (Lean live mode -> plugin -> tz-mock). Outside pull requests, push it to
#              ghcr.io/<owner>/lean-tradezero:sha-<commit> (an immutable, tested candidate).
#   publish -> (main and v* tags only) promote that exact image: add :latest / :lean-<version> /
#              :<tag> with a registry-side retag. Nothing is rebuilt, so what ships is what was tested.
name: Test, build and publish

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      lean_ref:
        description: QuantConnect/Lean git ref the tests build against (when no Lean branch has this branch's name)
        default: master
      lean_image:
        description: Lean image used to compile/test and as the base of the published image
        default: quantconnect/lean:latest

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  LEAN_REF: ${{ inputs.lean_ref || 'master' }}
  LEAN_IMAGE: ${{ inputs.lean_image || 'quantconnect/lean:latest' }}
  REPO_DIR: Lean.Brokerages.TradeZero

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      # the Lean image is ~27 GB: make room on the hosted runner
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      # the projects reference Lean as a sibling folder (../Lean)
      - name: Checkout TradeZero brokerage
        uses: actions/checkout@v4
        with:
          path: ${{ env.REPO_DIR }}

      - name: Checkout Lean (same branch name)
        id: lean-same-branch
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: QuantConnect/Lean
          ref: ${{ github.head_ref || github.ref_name }}
          path: Lean

      - name: Checkout Lean (${{ env.LEAN_REF }})
        if: steps.lean-same-branch.outcome != 'success'
        uses: actions/checkout@v4
        with:
          repository: QuantConnect/Lean
          ref: ${{ env.LEAN_REF }}
          path: Lean

      # the Lean image ships the .NET SDK and Python/pythonnet, like the dev container
      - name: Pull Lean image
        run: docker pull "$LEAN_IMAGE"

      - name: Start tz-mock
        run: |
          docker build -t tz-mock "$REPO_DIR/tz-mock"
          docker run -d --name tzmock -p 127.0.0.1:8000:8000 tz-mock
          for _ in $(seq 30); do
            curl -sf http://127.0.0.1:8000/mock/scenarios > /dev/null && exit 0
            sleep 1
          done
          docker logs tzmock
          exit 1

      - name: Compile
        run: |
          docker run --rm --network host --entrypoint dotnet \
            -v "$GITHUB_WORKSPACE:/work" -w "/work/$REPO_DIR" "$LEAN_IMAGE" \
            build QuantConnect.TradeZeroBrokerage.sln -c Release /v:quiet /p:WarningLevel=1

      - name: Run tests (no TradeZero credentials)
        run: |
          docker run --rm --network host --entrypoint dotnet \
            -v "$GITHUB_WORKSPACE:/work" -w "/work/$REPO_DIR" \
            -e TZ_MOCK_URL=http://127.0.0.1:8000 "$LEAN_IMAGE" \
            test QuantConnect.TradeZeroBrokerage.Tests/QuantConnect.TradeZeroBrokerage.Tests.csproj \
              -c Release --no-build --filter "TestCategory!=Paper" \
              --logger "trx;LogFileName=tests.trx" --logger "console;verbosity=normal" \
              --results-directory /work/test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          if-no-files-found: ignore

      - name: tz-mock logs
        if: failure()
        run: docker logs tzmock 2>&1 | tail -200

  build:
    name: Build image
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.names.outputs.image }}
      candidate: ${{ steps.names.outputs.candidate }}
      lean_version: ${{ steps.base.outputs.lean_version }}
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - name: Checkout
        uses: actions/checkout@v4

      - name: Image names
        id: names
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/lean-tradezero"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "candidate=${image}:sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Pull Lean image
        id: base
        run: |
          docker pull "$LEAN_IMAGE"
          version=$(docker inspect --format '{{ index .Config.Labels "lean_version" }}' "$LEAN_IMAGE")
          echo "lean_version=${version}" >> "$GITHUB_OUTPUT"
          echo "Lean version of $LEAN_IMAGE: ${version:-unknown}"

      - name: Build image
        env:
          LEAN_VERSION: ${{ steps.base.outputs.lean_version }}
          CANDIDATE: ${{ steps.names.outputs.candidate }}
        run: |
          docker build \
            --build-arg LEAN_IMAGE="$LEAN_IMAGE" \
            --label org.opencontainers.image.source="https://github.com/${GITHUB_REPOSITORY}" \
            --label org.opencontainers.image.revision="${GITHUB_SHA}" \
            --label lean_version="${LEAN_VERSION}" \
            -t "$CANDIDATE" .

      - name: Smoke test image (Lean live mode -> plugin -> tz-mock)
        run: docker/smoke-test.sh "${{ steps.names.outputs.candidate }}"

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push tested candidate
        if: github.event_name != 'pull_request'
        env:
          CANDIDATE: ${{ steps.names.outputs.candidate }}
        run: |
          docker push "$CANDIDATE"
          echo "Pushed tested candidate \`${CANDIDATE}\`" | tee -a "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish
    needs: build
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      packages: write
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # registry-side retag of the tested image: no rebuild, no 27 GB pull
      - name: Promote candidate
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          CANDIDATE: ${{ needs.build.outputs.candidate }}
          LEAN_VERSION: ${{ needs.build.outputs.lean_version }}
        run: |
          tags=()
          if [ -n "$LEAN_VERSION" ]; then tags+=("lean-${LEAN_VERSION}"); fi
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then tags+=("latest"); fi
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then tags+=("${GITHUB_REF_NAME}"); fi
          for tag in "${tags[@]}"; do
            docker buildx imagetools create --tag "${IMAGE}:${tag}" "$CANDIDATE"
            echo "Published \`${IMAGE}:${tag}\` (from \`${CANDIDATE}\`)" | tee -a "$GITHUB_STEP_SUMMARY"
          done
