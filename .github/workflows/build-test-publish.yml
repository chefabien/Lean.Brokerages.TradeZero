# Build the TradeZero brokerage, test it, and publish the plugin DLL as a GitHub Release asset.
#
# Build    compile the solution in the Lean image (tests), and build the plugin DLL against the binaries of
#          that exact Lean image: dist/tradezero-plugin-lean<V>.zip (+ .sha256).
# Test     every test that needs no TradeZero credentials (unit, tz-mock, Lean brokerage suite, Python),
#          the launcher's unit tests, and an end-to-end smoke test of the zip on the plain Lean image.
#          Paper-API tests (category "Paper") are never run here: they are run locally only.
# Publish  tag v*: create the GitHub Release with the zip. Manual run with release_tag: add the zip built for
#          another Lean version to that existing release (a release can serve several Lean versions).
#
# Lean is pinned to a fixed version (no floating tag). Users get the matching asset through
# docker/tradezero_live.py.
name: Build, test and publish

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      lean_version:
        description: Lean version to build and test against (quantconnect/lean:<version>)
        default: "18278"
      release_tag:
        description: Existing release tag to add the asset to (builds that tag's code); empty = no publishing
        default: ""
      lean_ref:
        description: QuantConnect/Lean git ref the tests compile against (when no Lean branch has this branch's name)
        default: master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.release_tag }}-${{ inputs.lean_version }}
  cancel-in-progress: true

env:
  # bump deliberately: the published asset is built for exactly this Lean version
  LEAN_VERSION: ${{ inputs.lean_version || '18278' }}
  LEAN_REF: ${{ inputs.lean_ref || 'master' }}
  REPO_DIR: Lean.Brokerages.TradeZero

jobs:
  build-test-publish:
    name: Build, test, publish
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      # ---------------------------------------------------------------- setup

      # the Lean image is ~27 GB: make room on the hosted runner
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      # the projects reference Lean as a sibling folder (../Lean)
      - name: Checkout TradeZero brokerage
        uses: actions/checkout@v4
        with:
          path: ${{ env.REPO_DIR }}
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Checkout Lean (same branch name)
        id: lean-same-branch
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: QuantConnect/Lean
          ref: ${{ github.head_ref || github.ref_name }}
          path: Lean

      - name: Checkout Lean (${{ env.LEAN_REF }})
        if: steps.lean-same-branch.outcome != 'success'
        uses: actions/checkout@v4
        with:
          repository: QuantConnect/Lean
          ref: ${{ env.LEAN_REF }}
          path: Lean

      - name: Pull Lean ${{ env.LEAN_VERSION }}
        run: |
          docker pull "quantconnect/lean:${LEAN_VERSION}"
          label=$(docker inspect --format '{{ index .Config.Labels "lean_version" }}' "quantconnect/lean:${LEAN_VERSION}")
          if [ "$label" != "$LEAN_VERSION" ]; then
            echo "::error::quantconnect/lean:${LEAN_VERSION} reports lean_version '${label}'"
            exit 1
          fi
          echo "LEAN_IMAGE=quantconnect/lean:${LEAN_VERSION}" >> "$GITHUB_ENV"
          df -h /

      # ---------------------------------------------------------------- build

      - name: "Build: compile solution (tests)"
        run: |
          docker run --rm --network host --entrypoint dotnet \
            -v "$GITHUB_WORKSPACE:/work" -w "/work/$REPO_DIR" "$LEAN_IMAGE" \
            build QuantConnect.TradeZeroBrokerage.sln -c Release /v:quiet /p:WarningLevel=1

      # compiled from a clean copy of the project (no bin/obj) against the image's own Lean binaries
      - name: "Build: plugin release asset"
        run: |
          mkdir -p dist
          docker run --rm --entrypoint bash \
            -v "$GITHUB_WORKSPACE/$REPO_DIR:/src:ro" -v "$GITHUB_WORKSPACE/dist:/dist" "$LEAN_IMAGE" -c '
              set -e
              mkdir -p /tmp/build
              tar -C /src --exclude=bin --exclude=obj -cf - QuantConnect.TradeZeroBrokerage | tar -C /tmp/build -xf -
              dotnet build /tmp/build/QuantConnect.TradeZeroBrokerage/QuantConnect.TradeZeroBrokerage.csproj \
                -c Release -p:LeanBinDir=/Lean/Launcher/bin/Debug -o /tmp/out /v:quiet
              cp /tmp/out/QuantConnect.Brokerages.TradeZero.dll /tmp/out/QuantConnect.Brokerages.TradeZero.pdb \
                 /tmp/out/QuantConnect.Brokerages.TradeZero.xml /dist/'
          cd dist
          name="tradezero-plugin-lean${LEAN_VERSION}.zip"
          python3 -m zipfile -c "$name" QuantConnect.Brokerages.TradeZero.dll QuantConnect.Brokerages.TradeZero.pdb \
            QuantConnect.Brokerages.TradeZero.xml
          sha256sum "$name" > "$name.sha256"
          echo "ASSET=dist/$name" >> "$GITHUB_ENV"
          cat "$name.sha256"

      # ---------------------------------------------------------------- test

      - name: "Test: start tz-mock"
        run: |
          docker build -t tz-mock "$REPO_DIR/tz-mock"
          docker run -d --name tzmock -p 127.0.0.1:8000:8000 tz-mock
          for _ in $(seq 30); do
            curl -sf http://127.0.0.1:8000/mock/scenarios > /dev/null && exit 0
            sleep 1
          done
          docker logs tzmock
          exit 1

      - name: "Test: unit, tz-mock, Lean brokerage suite, Python (no TradeZero credentials)"
        run: |
          docker run --rm --network host --entrypoint dotnet \
            -v "$GITHUB_WORKSPACE:/work" -w "/work/$REPO_DIR" \
            -e TZ_MOCK_URL=http://127.0.0.1:8000 "$LEAN_IMAGE" \
            test QuantConnect.TradeZeroBrokerage.Tests/QuantConnect.TradeZeroBrokerage.Tests.csproj \
              -c Release --no-build --filter "TestCategory!=Paper" \
              --logger "trx;LogFileName=tests.trx" --logger "console;verbosity=normal" \
              --results-directory /work/test-results

      - name: "Test: launcher unit tests"
        run: python3 -m unittest discover -s "$REPO_DIR/docker" -v

      - name: "Test: smoke test of the release asset (plain Lean image + plugin + tz-mock)"
        run: '"$REPO_DIR/docker/smoke-test.sh" "$ASSET"'

      - name: "Test: upload results and asset"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-and-asset
          path: |
            test-results/
            dist/tradezero-plugin-lean*
          if-no-files-found: ignore

      - name: "Test: tz-mock logs"
        if: failure()
        run: docker logs tzmock 2>&1 | tail -200

      # ---------------------------------------------------------------- publish

      - name: "Publish: release asset"
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" "$ASSET.sha256" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$ASSET" "$ASSET.sha256" --verify-tag --generate-notes --repo "$GITHUB_REPOSITORY"
          fi
          echo "Published \`$(basename "$ASSET")\` to release \`$TAG\`" | tee -a "$GITHUB_STEP_SUMMARY"
